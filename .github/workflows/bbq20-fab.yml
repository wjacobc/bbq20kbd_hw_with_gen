name: Build BBQ20 JLCPCB files

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Upstream solderparty/bbq20kbd_hw branch, tag, or commit"
        required: true
        default: "main"

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Solder Party BBQ20 hardware
        uses: actions/checkout@v4
        with:
          repository: solderparty/bbq20kbd_hw
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Export KiCad manufacturing data
        uses: actions-for-kicad/kicad-actions@v2-k10.0
        with:
          project_file_name: ./bbq20_keyboard.kicad_pro

          schematic_file_name: ./bbq20_keyboard.kicad_sch
          schematic_output_bom: true
          schematic_output_bom_file_name: raw_bom.csv
          schematic_output_bom_fields: 'Reference,Value,Footprint,LCSC,${QUANTITY},${DNP}'
          schematic_output_bom_labels: 'Designator,Comment,Footprint,LCSC Part #,Qty,DNP'

          pcb_file_name: ./bbq20_keyboard.kicad_pcb
          pcb_output_gerbers_and_drill: true
          pcb_output_gerbers_and_drill_folder_name: gerbers

          pcb_output_pos: true
          pcb_output_pos_file_name: raw_positions.csv
          pcb_output_pos_format: csv
          pcb_output_pos_side: both

      - name: Convert BOM and placement data to JLCPCB column names
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          def norm(s):
              return (s or "").strip()

          # ----- BOM -----
          src = Path("raw_bom.csv")
          if not src.exists():
              raise SystemExit("raw_bom.csv was not generated")

          with src.open(newline="", encoding="utf-8-sig") as f:
              rows = list(csv.DictReader(f))

          out_rows = []
          missing = []

          for r in rows:
              designator = norm(r.get("Designator") or r.get("Reference"))
              comment = norm(r.get("Comment") or r.get("Value"))
              footprint = norm(r.get("Footprint"))
              lcsc = norm(r.get("LCSC Part #") or r.get("LCSC"))
              dnp = norm(r.get("DNP")).lower()

              if not designator:
                  continue
              if dnp in {"1", "true", "yes", "y", "dnp"}:
                  continue

              out_rows.append({
                  "Comment": comment,
                  "Designator": designator,
                  "Footprint": footprint,
                  "LCSC Part #": lcsc,
              })
              if not lcsc:
                  missing.append((designator, comment, footprint))

          with open("bom_jlcpcb.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(
                  f,
                  fieldnames=["Comment", "Designator", "Footprint", "LCSC Part #"]
              )
              w.writeheader()
              w.writerows(out_rows)

          with open("missing_lcsc.txt", "w", encoding="utf-8") as f:
              if not missing:
                  f.write("No blank LCSC fields found in exported BOM.\n")
              else:
                  f.write("Components with blank LCSC fields:\n")
                  for ref, val, fp in missing:
                      f.write(f"{ref}: {val} | {fp}\n")

          # ----- CPL / pick-and-place -----
          psrc = Path("raw_positions.csv")
          if not psrc.exists():
              raise SystemExit("raw_positions.csv was not generated")

          with psrc.open(newline="", encoding="utf-8-sig") as f:
              preader = csv.DictReader(f)
              prows = list(preader)

          def get(r, *names):
              lower = {str(k).strip().lower(): v for k, v in r.items()}
              for n in names:
                  if n.lower() in lower:
                      return norm(lower[n.lower()])
              return ""

          cpl = []
          for r in prows:
              ref = get(r, "Ref", "Reference", "Designator")
              x = get(r, "PosX", "Mid X", "X")
              y = get(r, "PosY", "Mid Y", "Y")
              rot = get(r, "Rot", "Rotation")
              side = get(r, "Side", "Layer").lower()

              if not ref:
                  continue

              if side in {"front", "top", "f", "f.cu"}:
                  layer = "Top"
              elif side in {"back", "bottom", "b", "b.cu"}:
                  layer = "Bottom"
              else:
                  layer = side.title() if side else ""

              cpl.append({
                  "Designator": ref,
                  "Mid X": x,
                  "Mid Y": y,
                  "Rotation": rot,
                  "Layer": layer,
              })

          with open("cpl_jlcpcb.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(
                  f,
                  fieldnames=["Designator", "Mid X", "Mid Y", "Rotation", "Layer"]
              )
              w.writeheader()
              w.writerows(cpl)

          print(f"Wrote {len(out_rows)} BOM rows to bom_jlcpcb.csv")
          print(f"Wrote {len(cpl)} placement rows to cpl_jlcpcb.csv")
          print(f"{len(missing)} BOM rows have no LCSC number")
          PY

      - name: Package Gerbers and drill files
        shell: bash
        run: |
          test -d gerbers
          cd gerbers
          zip -r ../bbq20_jlcpcb_gerbers.zip .
          cd ..

      - name: Record upstream revision
        shell: bash
        run: |
          {
            echo "Source: https://github.com/solderparty/bbq20kbd_hw"
            echo "Requested ref: ${{ inputs.source_ref }}"
            echo "Resolved commit: $(git rev-parse HEAD)"
            echo
            echo "Files:"
            echo "  bbq20_jlcpcb_gerbers.zip  -> PCB fabrication upload"
            echo "  bom_jlcpcb.csv            -> assembly BOM"
            echo "  cpl_jlcpcb.csv            -> component placement/CPL"
            echo "  missing_lcsc.txt           -> components needing manual part selection"
            echo
            echo "IMPORTANT: Inspect JLCPCB's assembly preview before ordering."
            echo "Bottom-side rotations and unusual footprints can require manual correction."
          } > manufacturing_manifest.txt

      - name: Upload manufacturing package
        uses: actions/upload-artifact@v4
        with:
          name: bbq20-jlcpcb-manufacturing
          if-no-files-found: error
          path: |
            bbq20_jlcpcb_gerbers.zip
            bom_jlcpcb.csv
            cpl_jlcpcb.csv
            missing_lcsc.txt
            manufacturing_manifest.txt
            raw_bom.csv
            raw_positions.csv
